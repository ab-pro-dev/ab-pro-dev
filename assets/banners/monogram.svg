<style>.float{animation:float 10s ease-in-out infinite}.float2{animation:float 10s ease-in-out -4s infinite}.pulse{animation:pulse 6s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.float,.float2,.pulse{animation:none}}</style>
