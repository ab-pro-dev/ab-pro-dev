<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">Abera Hagazi — Sculpted AB monogram</title><desc id="desc">Full-stack developer. Thoughtful interfaces. Reliable systems. Sculpted AB monogram illustration with gentle ambient animation.</desc>
